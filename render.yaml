# =============================================================================
#  render.yaml — Blueprint לפריסה ב-Render
# -----------------------------------------------------------------------------
#  Render → New → Blueprint → בחרו את הריפו. Render יקרא את הקובץ הזה.
#
#  מה שמסומן `sync: false` לא נשמר בקובץ ולא נכנס ל-git — יש להזין אותו
#  ידנית ב-Dashboard → Environment. אלה סודות.
#
#  הממשק הוא אתר סטטי בלבד. כל הנתונים, ההתחברות והלוגיקה המאובטחת יושבים
#  ב-Firebase (Auth / Firestore / Storage / Cloud Functions) — אין שרת Node
#  משלנו. Firestore/Storage rules ו-Cloud Functions נפרסים דרך Firebase CLI
#  (ראו firebase.json), לא דרך Render.
# =============================================================================

services:
  # ── הממשק ─────────────────────────────────────────────────────────────────
  #  אתר סטטי על CDN. אין כאן מכונה שנרדמת, ולכן אין מסך המתנה של Render.
  - type: web
    name: wedding-planner-web
    runtime: static
    #  --include=dev חובה: NODE_ENV=production גורם ל-npm לדלג על
    #  devDependencies, ואז vite לא מותקן וה-build נכשל.
    buildCommand: npm ci --include=dev && npm run build
    staticPublishPath: ./dist

    envVars:
      #  ערכי Firebase נצרבים לתוך ה-bundle ולכן חייבים להיות מוגדרים לפני
      #  הבנייה — אין דרך להוסיף אותם אחרי כן בלי בנייה מחדש.
      #  VITE_FIREBASE_ENV חייב להיות 'prod' בדיוק — כל ערך אחר מפיל את הבנייה.
      - key: VITE_FIREBASE_ENV
        sync: false
      - key: VITE_FIREBASE_API_KEY
        sync: false
      - key: VITE_FIREBASE_AUTH_DOMAIN
        sync: false
      - key: VITE_FIREBASE_PROJECT_ID
        sync: false
      - key: VITE_FIREBASE_STORAGE_BUCKET
        sync: false
      - key: VITE_FIREBASE_MESSAGING_SENDER_ID
        sync: false
      - key: VITE_FIREBASE_APP_ID
        sync: false

    routes:
      #  ניתוב צד-לקוח: כל נתיב שאין לו קובץ מקבל את index.html.
      - type: rewrite
        source: /*
        destination: /index.html

    #  Render אינה קוראת את public/_headers (זה פורמט של Netlify /
    #  Cloudflare Pages). לאתר הסטטי הכותרות חייבות לצאת מכאן. שני המקומות
    #  צריכים להישאר תואמים.
    headers:
      - path: /*
        name: Content-Security-Policy
        value: >-
          default-src 'self'; script-src 'self'; worker-src 'self';
          style-src 'self' 'unsafe-inline' https://fonts.googleapis.com;
          font-src 'self' data: https://fonts.gstatic.com;
          img-src 'self' data: blob: https://firebasestorage.googleapis.com;
          connect-src 'self' https://fonts.googleapis.com https://fonts.gstatic.com
          https://identitytoolkit.googleapis.com https://securetoken.googleapis.com
          https://firestore.googleapis.com https://firebasestorage.googleapis.com
          https://europe-west1-wedding-planner-c3d62.cloudfunctions.net;
          object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: no-referrer
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()
      - path: /*
        name: Cross-Origin-Opener-Policy
        value: same-origin
      #  ה-Service Worker חייב להיבדק מול השרת בכל טעינה, אחרת תיקון
      #  בלוגיקת המטמון עצמו לא מגיע למי שכבר ביקר באתר.
      - path: /sw.js
        name: Cache-Control
        value: no-cache

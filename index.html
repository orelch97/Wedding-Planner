<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- אייקונים. iOS מתעלם מ-SVG במסך הבית ודורש PNG דרך apple-touch-icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- תואם לרקע הנייר של הלוגו, כדי ששורת המצב לא תיצור פס כהה מעל המסך. -->
    <meta name="theme-color" content="#f7f6f2" />
    <!-- פתיחה כאפליקציה עצמאית אחרי הוספה למסך הבית, בלי סרגל הדפדפן. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- הכיתוב שמופיע מתחת לאייקון במסך הבית. חייב להיות קצר. -->
    <meta name="apple-mobile-web-app-title" content="החתונה שלנו" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>תכנון החתונה שלי</title>

    <!--  מסך פתיחה סטטי. הוא נצבע לפני שקובץ ה-JS בכלל ירד, ולכן מכסה גם
          את השניות שבהן השרת בענן מתעורר. React מחליף אותו ברגע העלייה.
          CSS מוטבע בלבד — ה-CSP חוסם <script> מוטבע, ו-style-src מתיר style. -->
    <style>
      #boot {
        position: fixed;
        inset: 0;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 18px;
        padding: 24px;
        background: linear-gradient(180deg, #ffffff 0%, #faf6ee 55%, #f3f6ef 100%);
        font-family: "Heebo", system-ui, -apple-system, "Segoe UI", sans-serif;
        text-align: center;
        color: #334155;
      }
      /*  שני טבעות מסתובבים בכיוונים הפוכים סביב לב פועם. המידות והצבעים
          זהים ל-BootScreen שב-App.jsx, אחרת המעבר ל-React נראה כמו קפיצה.  */
      #boot .boot-mark {
        position: relative;
        display: grid;
        place-items: center;
        width: 80px;
        height: 80px;
      }
      #boot .boot-ring {
        position: absolute;
        inset: 0;
        border-radius: 50%;
        border: 3px solid #f3e9d4;
        border-top-color: #c9a86a;
        animation: boot-spin 1.6s linear infinite;
      }
      #boot .boot-ring-inner {
        position: absolute;
        inset: 8px;
        border-radius: 50%;
        border: 2px solid transparent;
        border-bottom-color: #a3b18a;
        animation: boot-spin 2.4s linear infinite reverse;
      }
      #boot .boot-heart {
        width: 26px;
        height: 26px;
        color: #c9a86a;
        animation: boot-beat 1.8s ease-in-out infinite;
      }
      #boot .boot-title {
        margin: 0;
        font-size: 19px;
        font-weight: 700;
        color: #1f2937;
      }
      #boot .boot-text {
        margin: 0;
        max-width: 22rem;
        font-size: 14px;
        line-height: 1.6;
        color: #6b7280;
      }
      #boot .boot-dots {
        display: flex;
        gap: 6px;
      }
      #boot .boot-dots span {
        width: 7px;
        height: 7px;
        border-radius: 50%;
        background: #d9bb7c;
        animation: boot-pulse 1.2s ease-in-out infinite;
      }
      #boot .boot-dots span:nth-child(2) {
        animation-delay: 0.15s;
      }
      #boot .boot-dots span:nth-child(3) {
        animation-delay: 0.3s;
      }
      @keyframes boot-spin {
        to {
          transform: rotate(360deg);
        }
      }
      @keyframes boot-beat {
        0%,
        100% {
          transform: scale(1);
          opacity: 0.85;
        }
        50% {
          transform: scale(1.12);
          opacity: 1;
        }
      }
      @keyframes boot-pulse {
        0%,
        100% {
          opacity: 0.25;
          transform: translateY(0);
        }
        50% {
          opacity: 1;
          transform: translateY(-3px);
        }
      }
      @media (prefers-reduced-motion: reduce) {
        #boot .boot-ring,
        #boot .boot-ring-inner,
        #boot .boot-heart,
        #boot .boot-dots span {
          animation: none;
        }
      }
    </style>
  </head>
  <body>
    <div id="root">
      <div id="boot">
        <img src="/icon-192.png" alt="" width="72" height="72" style="border-radius: 20px" />
        <div class="boot-mark">
          <div class="boot-ring"></div>
          <div class="boot-ring-inner"></div>
          <svg
            class="boot-heart"
            viewBox="0 0 24 24"
            fill="currentColor"
            stroke="currentColor"
            stroke-width="1.5"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M20.84 4.61a5.5 5.5 0 0 0-7.78 0L12 5.67l-1.06-1.06a5.5 5.5 0 0 0-7.78 7.78l1.06 1.06L12 21.23l7.78-7.78 1.06-1.06a5.5 5.5 0 0 0 0-7.78z"
            />
          </svg>
        </div>
        <p class="boot-title">מכינים את החתונה שלכם…</p>
        <p class="boot-text">
          המערכת עולה כעת. הטעינה הראשונה עשויה לקחת עד דקה — אחר כך היא מיידית.
        </p>
        <div class="boot-dots"><span></span><span></span><span></span></div>
      </div>
    </div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

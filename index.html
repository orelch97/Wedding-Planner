<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- אייקונים. iOS מתעלם מ-SVG במסך הבית ודורש PNG דרך apple-touch-icon. -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />

    <!-- תואם לרקע הנייר של הלוגו, כדי ששורת המצב לא תיצור פס כהה מעל המסך. -->
    <meta name="theme-color" content="#f7f6f2" />
    <!-- פתיחה כאפליקציה עצמאית אחרי הוספה למסך הבית, בלי סרגל הדפדפן. -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <!-- הכיתוב שמופיע מתחת לאייקון במסך הבית. חייב להיות קצר. -->
    <meta name="apple-mobile-web-app-title" content="החתונה שלנו" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Heebo:wght@300;400;500;600;700;800&family=Frank+Ruhl+Libre:wght@500;600;700&display=swap"
      rel="stylesheet"
    />
    <title>תכנון החתונה שלי</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>

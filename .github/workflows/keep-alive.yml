# =============================================================================
#  keep-alive — משאיר את השרת ער בשעות הפעילות
# -----------------------------------------------------------------------------
#  Render מכבה שירות בתוכנית החינמית אחרי 15 דקות ללא תנועה נכנסת, וההתעוררות
#  לוקחת כ-20-60 שניות. בזמן הזה Render מציג מסך המתנה משלו — הדפדפן עדיין לא
#  קיבל את ה-HTML שלנו, ולכן מסך הטעינה של האפליקציה לא יכול להופיע.
#
#  פינג קבוע ל-/api/health נחשב תנועה נכנסת ומונע את הכיבוי.
#
#  למה לא 24 שעות ביממה: המכסה החינמית היא 750 שעות ריצה לחודש לכל workspace,
#  וחודש של 31 יום הוא 744 שעות — מרווח של 6 שעות בלבד. חריגה מהמכסה משעה את
#  השירות עד תחילת החודש הבא, כלומר אתר מת לזוגות אמיתיים. חלון של 19 שעות
#  ביממה צורך כ-590 שעות ומשאיר מרווח נוח גם לכניסות לילה של משתמשים.
#
#  04:00-22:59 UTC = 07:00-01:59 בשעון ישראל בקיץ, 06:00-00:59 בחורף.
#  מי שנכנס מחוץ לחלון עדיין נכנס רגיל — רק ממתין להתעוררות פעם אחת.
#  אין לכך שום השפעה על נתונים: המסד חיצוני (CockroachDB), הקבצים שמורים בתוכו
#  והסשנים בטבלה — לשרת עצמו אין מצב מקומי שאפשר לאבד.
# =============================================================================

name: keep-alive

on:
  schedule:
    - cron: "*/5 4-22 * * *"
  # הרצה ידנית מהלשונית Actions, לבדיקה או להערת השרת מיד.
  workflow_dispatch:

# ריצות פינג לא צריכות להצטבר זו על זו אם אחת מהן נתקעת בהתעוררות ארוכה.
concurrency:
  group: keep-alive
  cancel-in-progress: false

permissions: {}

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Ping health endpoint
        env:
          #  ניתן לדרוס דרך Settings → Secrets and variables → Actions → Variables
          #  אם כתובת הייצור תשתנה, בלי לגעת בקובץ.
          URL: ${{ vars.KEEPALIVE_URL || 'https://wedding-planner-vixy.onrender.com/api/health' }}
        run: |
          #  שלושה ניסיונות: התעוררות קרה יכולה לקחת עד דקה, ופסק זמן יחיד היה
          #  מסמן תקלה על שרת שרק מתעורר. כישלון בשלושתם הוא באמת תקלה.
          for attempt in 1 2 3; do
            code=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 90 "$URL" || echo 000)
            echo "attempt $attempt -> HTTP $code"
            if [ "$code" = "200" ]; then
              exit 0
            fi
            sleep 15
          done
          echo "::error::הפינג ל-$URL נכשל בשלושת הניסיונות"
          exit 1

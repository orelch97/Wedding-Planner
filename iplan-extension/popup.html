<!doctype html>
<html lang="he" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <title>סנכרון iPlan לחתונה</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        width: 340px;
        padding: 16px;
        font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
        background: #f8fafc;
        color: #1e293b;
      }
      .card {
        background: #ffffff;
        border: 1px solid #e2e8f0;
        border-radius: 16px;
        padding: 14px;
        box-shadow: 0 4px 12px rgba(15, 23, 42, 0.05);
      }
      h1 {
        margin: 0 0 4px;
        font-size: 16px;
        font-weight: 700;
        color: #0f172a;
      }
      p.sub {
        margin: 0 0 12px;
        font-size: 12px;
        color: #64748b;
        line-height: 1.4;
      }
      .status-box {
        border-radius: 12px;
        padding: 10px 12px;
        font-size: 12px;
        margin-bottom: 12px;
        background: #f1f5f9;
        color: #334155;
      }
      .status-box.ok {
        background: #ecfdf5;
        color: #065f46;
        border: 1px solid #a7f3d0;
      }
      .status-box.err {
        background: #fff1f2;
        color: #9f1239;
        border: 1px solid #fecdd3;
      }
      button.primary {
        width: 100%;
        border: none;
        border-radius: 12px;
        padding: 10px 14px;
        font-size: 13px;
        font-weight: 700;
        background: #c89d54;
        color: #0f172a;
        cursor: pointer;
        transition: filter 0.15s;
      }
      button.primary:hover {
        filter: brightness(0.95);
      }
      button.primary:disabled {
        opacity: 0.6;
        cursor: not-allowed;
      }
      details {
        margin-top: 12px;
        font-size: 12px;
        color: #475569;
      }
      summary {
        cursor: pointer;
        font-weight: 600;
        margin-bottom: 8px;
      }
      label {
        display: block;
        margin-bottom: 8px;
        font-size: 11px;
        font-weight: 600;
      }
      input {
        width: 100%;
        margin-top: 3px;
        padding: 6px 8px;
        border-radius: 8px;
        border: 1px solid #cbd5e1;
        font-size: 11px;
        direction: ltr;
      }
      .note {
        margin-top: 10px;
        font-size: 11px;
        color: #64748b;
        line-height: 1.4;
      }
    </style>
  </head>
  <body>
    <div class="card">
      <h1>סנכרון אישורי הגעה מ-iPlan</h1>
      <p class="sub">
        התוסף מושך את ההזמנות מ-iPlan (בביקור באתר וכל 30 דקות ברקע) ומכין אותן לאישורכם במערכת החתונה.
      </p>

      <div id="statusBox" class="status-box">טוען מצב סנכרון…</div>

      <button id="syncNowBtn" class="primary">סנכרן עכשיו מ-iPlan</button>

      <p class="note">
        🔒 <strong>ללא עדכון אוטומטי כפוי:</strong> העדכון בפועל ברשומות המוזמנים מתבצע רק כשתלחצו על
        <strong>״עדכון אישורי הגעה״</strong> במערכת החתונה ותאשרו את הרשומות.
      </p>

      <details>
        <summary>הגדרות חיבור מתקדמות</summary>
        <label>
          מזהה אירוע ב-iPlan
          <input id="eventIdInput" type="text" />
        </label>
        <label>
          מזהה חתונה (Wedding ID)
          <input id="weddingIdInput" type="text" />
        </label>
        <label>
          מפתח סנכרון (Token)
          <input id="tokenInput" type="password" />
        </label>
        <button id="saveConfigBtn" class="primary" style="margin-top: 4px; background: #e2e8f0;">
          שמירת הגדרות
        </button>
      </details>
    </div>
    <script type="module" src="popup.js"></script>
  </body>
</html>
